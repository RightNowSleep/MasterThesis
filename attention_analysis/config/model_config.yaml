# Base model
base_model: "huggyllama/llama-7b" # Or any Llama model you have access to
# base_model: "NousResearch/Llama-2-7b-hf" # Can also use open-source alternatives

# List of RoPE configurations to test
rope_configs:
  - name: "default"
    rope_scaling: null

  - name: "dynamic"
    rope_scaling:
      type: "dynamic"
      factor: 2.0

  - name: "linear"
    rope_scaling:
      type: "linear"
      factor: 2.0

  - name: "yarn"
    rope_scaling:
      type: "yarn"
      factor: 2.0
      # yarn may require additional parameters, such as `original_max_position_embeddings`

# Visualization settings
visualization:
  layers_to_plot: [0, 15, 31] # Layers to plot (e.g., shallow, middle, deep)
  heads_to_plot: [0, 7]       # Attention heads to plot
  max_seq_length: 512         # Maximum sequence length to truncate for analysis